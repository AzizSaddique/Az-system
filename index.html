    <!-- Theme Initializer: Light theme by default for all visitors; applies saved choice before render -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme') || localStorage.getItem('portfolio-theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('light');
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>

    <!-- Google Fonts: Geist & Geist Mono (Non-render-blocking, subsetted weights) -->
