<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

    <meta charset="UTF-8" />

    <!-- Theme Initializer: Light theme by default for all visitors; applies saved choice before render -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme') || localStorage.getItem('portfolio-theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('light');
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>

    <!-- Preload critical self-hosted fonts used above the fold -->
    <link rel="preload" href="/assets/fonts/geist-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/geist-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
  </head>
